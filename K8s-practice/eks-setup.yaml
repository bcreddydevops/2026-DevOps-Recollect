apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: practice-eks
  region: us-east-1
  version: "1.36"

availabilityZones: ["us-east-1a", "us-east-1b"]

managedNodeGroups:
  - name: standard-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    volumeSize: 20
